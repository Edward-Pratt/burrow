[package]
name = "burrow-api"
description = "Burrow's command/event API: its types, and a JSON-RPC client for burrowd over any stream"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# Clients that aren't on the Linux desktop, such as the Android app, build
# this crate, so nothing here may need D-Bus, the Secret Service or XDG
# folders. Those stay in burrow-core.
[dependencies]
burrow-agent = { version = "0.1.2", path = "../burrow-agent" }
data-encoding = "2.11"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11"
toml = "1.1.8"
uuid = { version = "1.26.1", features = ["v4", "serde"] }
zeroize = "1.9.1"
