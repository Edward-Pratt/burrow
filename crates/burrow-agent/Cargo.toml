[package]
name = "burrow-agent"
description = "A small program Burrow runs on servers to report their state over SSH"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# Few dependencies, so the static binary stays small. The library is only
# the wire format, which `burrow-core` parses.
[dependencies]
libc = "0.2.191"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
