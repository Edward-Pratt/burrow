[package]
name = "burrow-cli"
description = "Burrow on the command line, and its MCP bridge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "burrow"
path = "src/main.rs"

[dependencies]
burrow-core = { version = "0.1.0", path = "../burrow-core" }
clap = { version = "4.5", features = ["derive"] }
libc = "0.2.191"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "signal", "sync", "time"] }

[dev-dependencies]
tempfile = "3.27.0"
