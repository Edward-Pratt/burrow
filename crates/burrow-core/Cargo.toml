[package]
name = "burrow-core"
description = "Burrow's UI-independent core: config tree, secrets and the command/event API"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
data-encoding = "2.11"
directories = "6.0.0"
getrandom = "0.4"
hmac = "0.13"
keyring-core = "1.0.1"
notify-debouncer-full = "0.7.0"
russh = { version = "0.64", default-features = false, features = ["ring", "rsa", "flate2"] }
russh-sftp = "3.0.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11"
sha2 = "0.11"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "sync", "macros", "net", "io-util", "process", "time", "fs"] }
toml = "1.1.8"
tracing = "0.1.44"
uuid = { version = "1.26.1", features = ["v4", "serde"] }
zbus-secret-service-keyring-store = { version = "1.0.1", features = ["rt-async-io-crypto-rust"] }
zeroize = "1.9.1"

[dev-dependencies]
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time"] }
toml = "1.1.8"
