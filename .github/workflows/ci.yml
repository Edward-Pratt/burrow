name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    # Arch, so the GTK, VTE and GtkSourceView versions match what Burrow
    # targets. openssh provides `ssh -G` and the sshd the SSH tests run, and
    # postgresql the server the database tests run. The keyring is reached
    # over D-Bus, so no libsecret.
    container: archlinux:latest
    # Lint and test build mostly different artifacts, so they run side by
    # side rather than one after the other. agent builds burrow-agent the
    # way servers get it, for both targets.
    strategy:
      fail-fast: false
      matrix:
        check: [lint, test, agent]
    env:
      # The checks run as builder, but the cache action runs as root and
      # needs the same toolchain and cargo home.
      RUSTUP_HOME: /home/builder/.rustup
      CARGO_HOME: /home/builder/.cargo
      # Debug info made up most of the cache, and slows linking the tests.
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - name: Install system packages
        run: |
          pacman -Syu --noconfirm --needed base-devel git rustup gtk4 vte4 gtksourceview5 openssh postgresql
          # initdb refuses to run as root, and the database tests would
          # quietly skip, so the checks run as a normal user.
          useradd --create-home builder

      - uses: actions/checkout@v4

      - name: Set up Rust
        run: |
          chown -R builder "$GITHUB_WORKSPACE" /home/builder
          su builder -c 'rustup default stable && rustup component add rustfmt clippy'

      # After the toolchain, since its version is part of the key.
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.check }}
          cache-on-failure: true

      - name: Give the cache to builder
        run: chown -R builder "$GITHUB_WORKSPACE" /home/builder

      - name: Format
        if: matrix.check == 'lint'
        run: su builder -c 'cargo fmt --all --check'

      - name: Lint
        if: matrix.check == 'lint'
        run: su builder -c 'cargo clippy --workspace --all-targets -- -D warnings'

      - name: Test
        if: matrix.check == 'test'
        run: su builder -c 'cargo test --workspace'

      - name: Build burrow-agent for servers
        if: matrix.check == 'agent'
        run: |
          su builder -c 'rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl'
          for target in x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            su builder -c "cargo build -p burrow-agent --profile agent --target $target"
          done

  # Each green push to main becomes the build that `burrow-update`
  # downloads, so nobody compiles Burrow to install or update it. It
  # replaces the files of one release, build-main, whose tag follows main.
  # Built on the newest Arch, so it runs on an Arch kept up to date.
  release:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    container: archlinux:latest
    permissions:
      contents: write
    steps:
      - name: Install system packages
        run: pacman -Syu --noconfirm --needed base-devel git rustup gtk4 vte4 gtksourceview5 github-cli

      - uses: actions/checkout@v4

      - name: Set up Rust
        run: |
          rustup default stable
          rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2
        with:
          key: release

      # The same build and layout as `burrow-update --branch`, from the
      # script itself.
      - name: Build
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          dist/install.sh --stage out/burrow
          tar -czf burrow-x86_64.tar.gz -C out burrow
          sha256sum burrow-x86_64.tar.gz >SHA256SUMS
          cp out/burrow/commit commit

      # One file at a time, in the reverse of the order the script reads
      # them, so `commit` names a new build only once its files are there.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f build-main
          git push -f origin build-main
          if ! gh release view build-main >/dev/null 2>&1; then
            gh release create build-main --title "Latest build of main" --notes "" --latest
          fi
          for file in burrow-x86_64.tar.gz SHA256SUMS commit; do
            gh release upload build-main "$file" --clobber
          done
          gh release edit build-main --notes "Built from $GITHUB_SHA. Install it with dist/install.sh, which also keeps it up to date."
