name: Release

# A vX.Y.Z tag on main, made by `herald release`, becomes a stable
# release: the build `burrow-update --stable` installs. A vX.Y.Z-rc.N tag
# becomes a pre-release, which --stable skips. herald merges the version
# change through a pull request first, so the tagged commit passed CI.
on:
  push:
    tags: ['v*']

jobs:
  # The same build as ci.yml's build-main, from this tag alone.
  build:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install system packages
        run: pacman -Syu --noconfirm --needed base-devel git rustup gtk4 vte4 gtksourceview5

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # No build cache: what users install should come only from this tag.
      - name: Set up Rust
        run: |
          rustup default stable
          rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl

      # SHA256SUMS comes from the shared workflow, over every file here.
      - name: Build
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          dist/install.sh --stage out/burrow
          mkdir release
          tar -czf release/burrow-x86_64.tar.gz -C out burrow
          cp out/burrow/commit release/commit

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: release/
          if-no-files-found: error

  release:
    needs: build
    uses: Edward-Pratt/herald/.github/workflows/release.yml@v1
    with:
      artifact: release-files
    permissions:
      contents: write
