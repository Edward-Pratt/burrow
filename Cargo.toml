[workspace]
resolver = "3"
members = ["crates/burrow-core", "crates/burrow-gtk", "crates/burrow-addon-notes", "crates/burrowd", "crates/burrow-cli", "crates/burrow-agent"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "GPL-3.0-or-later"
repository = "https://github.com/Edward-Pratt/burrow"

# For burrow-agent, which is uploaded to servers, so size matters more than
# speed: `cargo build -p burrow-agent --profile agent --target <triple>`.
[profile.agent]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
